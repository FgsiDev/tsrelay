name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-amd64, goarch: amd64, goarm: "" }
          - { name: linux-386,   goarch: "386", goarm: "" }
          - { name: linux-arm64, goarch: arm64, goarm: "" }
          - { name: linux-armv7, goarch: arm,   goarm: "7" }
          - { name: linux-armv6, goarch: arm,   goarm: "6" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Init module
        run: |
          [ -f go.mod ] || go mod init tsrelay
          go mod tidy

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o dist/tsrelay-${{ matrix.name }} .

      - uses: actions/upload-artifact@v4
        with:
          name: tsrelay-${{ matrix.name }}
          path: dist/tsrelay-${{ matrix.name }}
          if-no-files-found: error

  release:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          chmod +x tsrelay-*
          sha256sum tsrelay-* > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          files: dist/*
          generate_release_notes: true
          make_latest: true
